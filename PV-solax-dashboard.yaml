type: picture-elements
image: /local/FVE_solax2.png
aspect_ratio: 120%
elements:
  - type: state-label
    entity: sensor.solax_state
    style:
      left: 16%
      top: 12.5%
      width: 113px
      height: 108px
      background-color: rgba(0, 0, 0, 0.6)
      border-radius: 15px
      color: transparent
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5)
  - type: state-badge
    entity: sensor.technicka_mistnost_fve_temperature
    name: null
    style:
      left: 10%
      top: 8%
      "--ha-label-badge-font-size": 1.2em
      "--ha-label-badge-background-color": rgba(0,0,0,0.4)
      "--label-badge-text-color": white
      "--label-badge-red": "#ff9800"
      "--ha-label-badge-title-font-size": 0.9em
  - type: state-badge
    entity: sensor.technicka_mistnost_fve_humidity
    name: null
    style:
      left: 22%
      top: 8%
      "--ha-label-badge-font-size": 1.2em
      "--ha-label-badge-background-color": rgba(0,0,0,0.4)
      "--label-badge-text-color": white
      "--label-badge-red": "#03a9f4"
      "--ha-label-badge-title-font-size": 0.9em
  - type: state-label
    entity: sensor.solax_state
    style:
      left: 16%
      top: 14%
      width: 260px
      text-align: center
      color: transparent
    card_mod:
      style: |
        :host:after {
          content: "Teplota a vlhkost \A v technické místnosti";
          white-space: pre;
          display: block;
          color: rgba(255, 255, 255, 0.8);
          font-size: 0.75em;
          line-height: 1.3;
          letter-spacing: 0.5px;
        }
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 10%
      left: 82%
      width: 130px
      height: 85px
      background-color: rgba(0, 0, 0, 0.6)
      border-radius: 10px
      color: transparent
      box-shadow: 0px 2px 5px rgba(0,0,0,0.5)
  - type: state-label
    entity: sensor.solax_inverter_sn
    prefix: "SN: "
    style:
      top: 5%
      left: 82%
      color: rgba(255, 255, 255, 0.6)
      font-size: 0.7em
  - type: state-label
    entity: sensor.solax_type
    style:
      top: 8.5%
      left: 82%
      color: white
      font-weight: bold
      font-size: 0.9em
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 12%
      left: 82%
      font-weight: 900
      font-size: 1.2em
      text-transform: uppercase
      letter-spacing: 1.5px
    card_mod:
      style: |
        :host {
          color: 
            {% if states(config.entity) in ['Normal', 'Run', 'Running', 'Wait Mode'] %} 
              #4caf50 
            {% elif states(config.entity) in ['Fault', 'Error'] %} 
              red 
            {% else %} 
              orange 
            {% endif %};
        }
  - type: state-label
    entity: sensor.solax_firmware
    prefix: "FW: "
    style:
      top: 15.5%
      left: 82.3%
      color: rgba(0, 220, 200, 20)
      font-size: 0.6em
  - type: state-label
    entity: sensor.solax_ac_power
    prefix: "Výkon: "
    style:
      left: 26%
      top: 33%
      color: white
      font-size: 1em
      text-shadow: 0px 0px 4px black
      background-color: rgba(0,0,0,0.3)
      border-radius: 8px
      padding: 2px 6px
  - type: state-badge
    entity: sensor.solax_inverter_temperature
    style:
      left: 40%
      top: 9%
      transform: scale(0.8)
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(0,0,0,0.6)
      "--label-badge-text-color": white
  - type: state-badge
    entity: sensor.solax_inverter_temperature_inner
    style:
      left: 40%
      top: 37%
      transform: scale(0.8)
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(0,0,0,0.6)
      "--label-badge-text-color": white
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 32%
      left: 82%
      width: 130px
      height: 120px
      background-color: rgba(0, 0, 0, 0.5)
      border-radius: 10px
      color: transparent
  - type: icon
    icon: mdi:flash
    style:
      top: 23%
      left: 70%
      color: "#ff9800"
      transform: scale(0.9)
  - type: icon
    icon: mdi:sine-wave
    style:
      top: 23%
      left: 79%
      color: "#ff9800"
      transform: scale(0.9)
  - type: icon
    icon: mdi:current-ac
    style:
      top: 23%
      left: 89%
      color: "#ff9800"
      transform: scale(0.9)
      
  # --- FÁZE 1 ---
  - type: state-label
