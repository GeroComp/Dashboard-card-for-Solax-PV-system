      font-size: 0.8em        # ZMENŠENÍ
      font-family: monospace
  - type: state-label
    entity: sensor.solax_aci1
    style:
      top: 30%
      left: 91.5%
      color: white
      font-weight: normal
      font-size: 0.8em        # ZMENŠENÍ
      font-family: monospace

  # --- FÁZE 2 ---
  - type: state-label
    entity: sensor.solax_acp2
    style:
      top: 34.8%
      left: 72%
      color: white
      font-weight: bold
      font-size: 1.1em        # ZMENŠENÍ
      font-family: monospace
  - type: state-label
    entity: sensor.solax_acu2
    style:
      top: 34.8%
      left: 82%
      color: white
      font-weight: normal
      font-size: 0.8em        # ZMENŠENÍ
      font-family: monospace
  - type: state-label
    entity: sensor.solax_aci2
    style:
      top: 34.8%
      left: 91.5%
      color: white
      font-weight: normal
      font-size: 0.8em        # ZMENŠENÍ
      font-family: monospace

  # --- FÁZE 3 ---
  - type: state-label
    entity: sensor.solax_acp3
    style:
      top: 39.5%
      left: 72%
      color: white
      font-weight: bold
      font-size: 1.1em        # ZMENŠENÍ
      font-family: monospace
  - type: state-label
    entity: sensor.solax_acu3
    style:
      top: 39.5%
      left: 82%
      color: white
      font-weight: normal
      font-size: 0.8em        # ZMENŠENÍ
      font-family: monospace
  - type: state-label
    entity: sensor.solax_aci3
    style:
      top: 39.5%
      left: 91.5%
      color: white
      font-weight: normal
      font-size: 0.8em        # ZMENŠENÍ
      font-family: monospace

  - type: state-icon
    entity: binary_sensor.x_sense_kourovy_senzor_fve_kour
    tap_action:
      action: toggle
    style:
      top: 45%
      left: 12%
      transform: scale(1.5)
      "--paper-item-icon-color": rgba(255, 255, 255, 0.4)
      "--paper-item-icon-active-color": red
    card_mod:
      style: |
        :host {
          animation: {{ 'blink 1s linear infinite' if is_state(config.entity, 'on') else 'none' }};
        }
        @keyframes blink {
          50% { opacity: 0; transform: scale(2.0); }
        }
  - type: state-icon
    entity: switch.chlazeni_stridace_solax
    tap_action:
      action: toggle
    style:
      top: 57%
      left: 51%
      color: rgba(255, 255, 255, 0.7)
      "--paper-item-icon-active-color": "#03a9f4"
    card_mod:
      style: |
        :host {
          transform-origin: center center;
          display: block;
        }
        state-badge {
          transform: translate(-50%, -50%) scale(1.8);
          animation: {{ 'rotation 2s linear infinite' if is_state(config.entity, 'on') else 'none' }};
        }
        @keyframes rotation {
          0% { transform: translate(-50%, -50%) scale(1.8) rotate(0deg); }
          100% { transform: translate(-50%, -50%) scale(1.8) rotate(360deg); }
        }
  - type: state-label
    entity: sensor.solax_mode
    style:
      top: 55%
      left: 85%
      background-color: rgba(0, 0, 0, 0.6)
      border-radius: 10px
      padding: 5px 15px
      color: white
      font-size: 0.8em
  - type: state-badge
    entity: sensor.solax_battery_power
    style:
      left: 48%
      top: 71%
      "--ha-label-badge-font-size": 1.3em
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(0,0,0,0.7)
      "--label-badge-text-color": white
  - type: state-badge
    entity: sensor.solax_battery_soc
    style:
      left: 89%
      top: 72%
      "--ha-label-badge-font-size": 1.3em
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": "#4caf50"
      "--label-badge-text-color": white
  - type: state-label
    entity: sensor.solax_battery_temperature
    prefix: "🌡 "
    style:
      left: 48%
      top: 85%
      background-color: rgba(0, 0, 0, 0.5)
      padding: 3px 6px
      border-radius: 4px
      color: white
      font-size: 1em
  - type: state-badge
    entity: sensor.solax_battery_in_total
    style:
      left: 64%
      top: 72%
      transform: scale(0.9)
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(255, 152, 0, 0.3)
  - type: state-label
    entity: sensor.solax_battery_remain
    style:
      left: 90%
      top: 85%
      background-color: rgba(0,0,0,0.5)
      border-radius: 4px
      padding: 3px 6px
      color: white
      font-size: 0.8em
