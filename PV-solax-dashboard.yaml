type: picture-elements
image: /local/FVE_solax2.png
aspect_ratio: 120%
elements:
  # --- STAV STŘÍDAČE (Levý horní box) ---
  - type: state-label
    entity: sensor.solax_state
    style:
      left: 16%
      top: 12.5%
      width: 113px
      height: 108px
      background-color: rgba(0, 0, 0, 0.6)
      border-radius: 15px
      color: transparent
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5)

  # --- TEPLOTA A VLHKOST (Bubliny vlevo nahoře) ---
  - type: state-badge
    entity: sensor.technicka_mistnost_fve_temperature
    name: null
    style:
      left: 10%
      top: 8%
      "--ha-label-badge-font-size": 1.2em
      "--ha-label-badge-background-color": rgba(0,0,0,0.4)
      "--label-badge-text-color": white
      "--label-badge-red": "#ff9800"
      "--ha-label-badge-title-font-size": 0.9em
  - type: state-badge
    entity: sensor.technicka_mistnost_fve_humidity
    name: null
    style:
      left: 22%
      top: 8%
      "--ha-label-badge-font-size": 1.2em
      "--ha-label-badge-background-color": rgba(0,0,0,0.4)
      "--label-badge-text-color": white
      "--label-badge-red": "#03a9f4"
      "--ha-label-badge-title-font-size": 0.9em
  - type: state-label
    entity: sensor.solax_state
    style:
      left: 16%
      top: 14%
      width: 260px
      text-align: center
      color: transparent
    card_mod:
      style: |
        :host:after {
          content: "Teplota a vlhkost \A v technické místnosti";
          white-space: pre;
          display: block;
          color: rgba(255, 255, 255, 0.8);
          font-size: 0.75em;
          line-height: 1.3;
          letter-spacing: 0.5px;
        }

  # --- INFORMAČNÍ BOX VPRAVO NAHOŘE (SN, Typ, FW) ---
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 10%
      left: 82%
      width: 130px
      height: 85px
      background-color: rgba(0, 0, 0, 0.6)
      border-radius: 10px
      color: transparent
      box-shadow: 0px 2px 5px rgba(0,0,0,0.5)
  - type: state-label
    entity: sensor.solax_inverter_sn
    prefix: "SN: "
    style:
      top: 5%
      left: 82%
      color: rgba(255, 255, 255, 0.6)
      font-size: 0.7em
  - type: state-label
    entity: sensor.solax_type
    style:
      top: 8.5%
      left: 82%
      color: orange
      font-weight: bold
      font-size: 0.9em
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 12%
      left: 82%
      font-weight: 900
      font-size: 1.2em
      text-transform: uppercase
      letter-spacing: 1.5px
    card_mod:
      style: |
        :host {
          color: 
            {% if states(config.entity) in ['Normal', 'Run', 'Running', 'Wait Mode'] %} 
              #4caf50 
            {% elif states(config.entity) in ['Fault', 'Error'] %} 
              red 
            {% else %} 
              orange 
            {% endif %};
        }
  - type: state-label
    entity: sensor.solax_firmware
    prefix: "FW: "
    style:
      top: 15.5%
      left: 82.3%
      color: rgba(0, 220, 200, 20)
      font-size: 0.6em

  # --- CELKOVÝ VÝKON A TEPLOTY STŘÍDAČE (Střední část) ---
  - type: state-label
    entity: sensor.solax_ac_power
    prefix: "Výkon: "
    style:
      left: 26%
      top: 33%
      color: white
      font-size: 1em
      text-shadow: 0px 0px 4px black
      background-color: rgba(0,0,0,0.3)
      border-radius: 8px
      padding: 2px 6px
  - type: icon
    icon: mdi:flash
    style:
      top: 30.9%
      left: 11.5%
      color: "#ff9800"
      transform: scale(0.9)
  - type: state-badge
    entity: sensor.solax_inverter_temperature
    style:
      left: 40%
      top: 9%
      transform: scale(0.8)
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(0,0,0,0.6)
      "--label-badge-text-color": white
  - type: state-badge
    entity: sensor.solax_inverter_temperature_inner
    style:
      left: 40%
      top: 37%
      transform: scale(0.8)
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(0,0,0,0.6)
      "--label-badge-text-color": white

  # ============================================================
  # === OBLAST FÁZÍ (Vpravo uprostřed) - S LINKAMI A L1-L3 ===
  # ============================================================
  
  # 1. Pozadí (Mírně zvýšené kvůli hlavičkám)
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 34%
      left: 81%  
      width: 150px
      height: 23%
      background-color: rgba(0, 0, 0, 0.5)
      border-radius: 10px
      color: transparent

  # 2. SVISLÉ LINKY (Oddělovače fází)
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 36%
      left: 77.6%  # Mezi L1 a L2
      width: 1.2px
      height: 17%
      background-color: white
      color: transparent
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 36%
      left: 87.6%  # Mezi L2 a L3
      width: 1px
      height: 17%
      background-color: white
      color: transparent

  # 3. HLAVIČKY (L1, L2, L3)
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 22%
      left: 77%
      color: transparent
    card_mod:
      style: |
        :host:after { content: 'L1'; color: #ff9800; font-weight: bold; font-size: 0.9em; }
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 22%
      left: 88%
      color: transparent
    card_mod:
      style: |
        :host:after { content: 'L2'; color: #ff9800; font-weight: bold; font-size: 0.9em; }
  - type: state-label
    entity: sensor.solax_state
    style:
      top: 22%
      left: 97.5%
      color: transparent
    card_mod:
      style: |
        :host:after { content: 'L3'; color: #ff9800; font-weight: bold; font-size: 0.9em; }

  # 4. Ikony (Posunuto na 63%)
  - type: icon
    icon: mdi:flash
    style:
      top: 27%
      left: 63%
      color: "#ff9800"
      transform: scale(0.9)
  - type: icon
    icon: mdi:sine-wave
    style:
      top: 33.8%
      left: 63%
      color: "#ff9800"
      transform: scale(0.9)
  - type: icon
    icon: mdi:current-ac
    style:
      top: 40.6%
      left: 63%
      color: "#ff9800"
      transform: scale(0.9)

  # 5. Řádek 1: VÝKON (W)
  - type: state-label
    entity: sensor.solax_acp1
    style:
      top: 29%
      left: 71%
      width: 60px
      text-align: right
      color: white
      font-weight: bold
      font-size: 0.8em
  - type: state-label
    entity: sensor.solax_acp2
    style:
      top: 29%
      left: 81%
      width: 60px
      text-align: right
      color: white
      font-weight: bold
      font-size: 0.8em
  - type: state-label
    entity: sensor.solax_acp3
    style:
      top: 29%
      left: 91%
      width: 60px
      text-align: right
      color: white
      font-weight: bold
      font-size: 0.8em

  # 6. Řádek 2: NAPĚTÍ (V)
  - type: state-label
    entity: sensor.solax_acu1
    style:
      top: 36%
      left: 71%
      width: 60px
      text-align: right
      color: rgba(255, 255, 255, 0.8)
      font-size: 0.75em
  - type: state-label
    entity: sensor.solax_acu2
    style:
      top: 36%
      left: 81%
      width: 60px
      text-align: right
      color: rgba(255, 255, 255, 0.8)
      font-size: 0.75em
  - type: state-label
    entity: sensor.solax_acu3
    style:
      top: 36%
      left: 91%
      width: 60px
      text-align: right
      color: rgba(255, 255, 255, 0.8)
      font-size: 0.75em

  # 7. Řádek 3: PROUD (A)
  - type: state-label
    entity: sensor.solax_aci1
    style:
      top: 43%
      left: 71%
      width: 60px
      text-align: right
      color: rgba(255, 255, 255, 0.8)
      font-size: 0.75em
  - type: state-label
    entity: sensor.solax_aci2
    style:
      top: 43%
      left: 81%
      width: 60px
      text-align: right
      color: rgba(255, 255, 255, 0.8)
      font-size: 0.75em
  - type: state-label
    entity: sensor.solax_aci3
    style:
      top: 43%
      left: 91%
      width: 60px
      text-align: right
      color: rgba(255, 255, 255, 0.8)
      font-size: 0.75em

  # ============================================================
  # === KONEC OBLASTI FÁZÍ ===
  # ============================================================

  # --- SENZORY (Kouř, Chlazení, Režim) ---
  - type: state-icon
    entity: binary_sensor.x_sense_kourovy_senzor_fve_kour
    tap_action:
      action: toggle
    style:
      top: 45%
      left: 12%
      transform: scale(1.5)
      "--paper-item-icon-color": rgba(255, 255, 255, 0.4)
      "--paper-item-icon-active-color": red
    card_mod:
      style: |
        :host {
          animation: {{ 'blink 1s linear infinite' if is_state(config.entity, 'on') else 'none' }};
        }
        @keyframes blink {
          50% { opacity: 0; transform: scale(2.0); }
        }
  - type: state-icon
    entity: switch.chlazeni_stridace_solax
    tap_action:
      action: toggle
    style:
      top: 57%
      left: 51%
      color: rgba(255, 255, 255, 0.7)
      "--paper-item-icon-active-color": "#03a9f4"
    card_mod:
      style: |
        :host {
          transform-origin: center center;
          display: block;
        }
        state-badge {
          transform: translate(-50%, -50%) scale(1.8);
          animation: {{ 'rotation 2s linear infinite' if is_state(config.entity, 'on') else 'none' }};
        }
        @keyframes rotation {
          0% { transform: translate(-50%, -50%) scale(1.8) rotate(0deg); }
          100% { transform: translate(-50%, -50%) scale(1.8) rotate(360deg); }
        }
  - type: state-label
    entity: sensor.solax_mode
    style:
      top: 55%
      left: 85%
      background-color: rgba(0, 0, 0, 0.6)
      border-radius: 10px
      padding: 5px 15px
      color: white
      font-size: 0.8em

  # --- BATERIE (Spodní část) ---
  - type: state-badge
    entity: sensor.solax_battery_power
    style:
      left: 48%
      top: 71%
      "--ha-label-badge-font-size": 1.2em
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(0,0,0,0.7)
      "--label-badge-text-color": white
  - type: state-badge
    entity: sensor.solax_battery_soc
    style:
      left: 89%
      top: 72%
      "--ha-label-badge-font-size": 1.2em
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": "#4caf50"
      "--label-badge-text-color": white
  - type: state-label
    entity: sensor.solax_battery_temperature
    prefix: "🌡 "
    style:
      left: 48%
      top: 85%
      background-color: rgba(0, 0, 0, 0.5)
      padding: 3px 6px
      border-radius: 4px
      color: white
      font-size: 1em
  - type: state-badge
    entity: sensor.solax_battery_in_total
    style:
      left: 64%
      top: 72%
      transform: scale(0.8)
      "--ha-label-badge-title-font-size": 0em
      "--ha-label-badge-background-color": rgba(255, 152, 0, 0.3)
  - type: state-label
    entity: sensor.solax_battery_remain
    style:
      left: 90%
      top: 85%
      background-color: rgba(0,0,0,0.5)
      border-radius: 4px
      padding: 3px 6px
      color: white
      font-size: 0.8em
